<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Predictions </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/base.css"> 
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="shell">
        <header class="appbar">
            <div class="brand">
                <div class="control-stack">
                    <div class="control-group" aria-label="Catalog scope selector">
                        <button class="control-btn scope-btn is-active" type="button" data-scope="all" aria-pressed="true">All Sports</button>
                        <button class="control-btn scope-btn" type="button" data-scope="favorites" aria-pressed="false">Favourites</button>
                    </div>

                    <div class="control-group" aria-label="Time range selector">
                        <button class="control-btn range-btn" type="button" data-range="pastWeek" aria-pressed="false">Results</button>
                        <button class="control-btn range-btn" type="button" data-range="live" aria-pressed="false">Live</button>
                        <button class="control-btn range-btn" type="button" data-range="today" aria-pressed="false">Upcoming</button>
                    </div>

                </div>
            </div>
    
            <div class="actions">
                <button id="logoutBtn" type="button" class="logout-btn">Sign Out</button>
                <button id="settingsBtn" type="button" class="settings-btn" aria-haspopup="dialog" aria-controls="apiKeyModal" aria-label="Settings" title="Settings">⚙</button>
            </div>
        </header>

        <div id="sportFilterBar" class="secondary-appbar hidden" aria-label="Result sport filters">
            <div id="sportFilterButtons" class="sport-filter-buttons"></div>
        </div>

        <div id="apiKeyModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="apiKeyModalTitle">
            <div class="modal-card">
                <div class="modal-header">
                    <h3 id="apiKeyModalTitle">API Key Settings</h3>
                    <button type="button" class="modal-close" data-close-modal="true" aria-label="Close settings">x</button>
                </div>
                
                <label class="field-label" for="apiKeyInput">API key</label>
                <div class="api-key-row">
                    <input id="apiKeyInput" class="api-key-input" type="text" autocomplete="off" spellcheck="false" placeholder="Paste your API key">
                    <button id="swapApiKeyBtn" type="button" class="api-key-swap-btn" aria-label="Swap API key" title="Swap API key">⇄</button>
                </div>
                <p id="apiKeyMasked" class="api-key-masked hidden" aria-live="polite"></p>

                <div class="settings-panel">
                    <div class="settings-section">
                        <label class="field-label">Sports scope</label>
                        <div class="settings-control-group" aria-label="Catalog scope selector">
                            <button class="control-btn scope-btn is-active" type="button" data-scope="all" aria-pressed="true">All Sports</button>
                            <button class="control-btn scope-btn" type="button" data-scope="favorites" aria-pressed="false">Favourites</button>
                        </div>
                    </div>

                    <div class="settings-section">
                        <label id="resultsSportScopeLabel" class="field-label" for="resultsSportScopeSelect">Results sport scope (All Sports)</label>
                        <select id="resultsSportScopeSelect" class="sport-scope-select" aria-label="Select which sport results to show">
                            <option value="all">All Sports</option>
                        </select>
                    </div>

                    <div class="settings-section">
                        <label class="field-label">Time frames</label>
                        <div class="settings-control-group" aria-label="Time range selector">
                            <button class="control-btn range-btn" type="button" data-range="pastWeek" aria-pressed="false">Results</button>
                            <button class="control-btn range-btn" type="button" data-range="live" aria-pressed="false">Live</button>
                            <button class="control-btn range-btn" type="button" data-range="today" aria-pressed="false">Upcoming</button>
                        </div>
                    </div>

                </div>
                
                <div class="modal-actions">
                    <div class="modal-actions-left">
                        <button type="button" id="cancelApiKeyBtn" class="danger-btn">Cancel</button>
                        <button type="button" id="clearHistoryCacheBtn">Clear Cache</button>
                    </div>
                    <div class="modal-actions-right">
                        <button type="button" id="saveApiKeyBtn">Save</button>
                    </div>
                </div>

                <p class="login-footer" aria-hidden="true">Made by Keirran Blackley.</p>
            </div>
        </div>  

        <div class="layout">
            <section class="panel">
                <div class="panel-head">
                    <div class="panel-head-row">
                        <button id="backBtn" type="button" class="hidden" aria-label="Back">←</button>
                        <div class="panel-head-copy">
                            <h1 id="pageTitle" class="title">Sports Catalog</h1>
                            <p id="panelSub" class="panel-sub">Live Odds & Predictions</p>
                        </div>
                    </div>
                </div>

                <div class="panel-body">
                    <div class="catalog-tools">
                        <input id="sportsSearchInput" class="sports-search-input" type="search" placeholder="Search sports by key, title or group" aria-label="Search sports catalog">
                    </div>
                    <div id="tableWrap" class="table-wrap">
                        <div class="empty">No data loaded yet.</div>
                    </div>
                    
                    <div id="upcomingWrap" class="subcard hidden">
                        <p class="subhead">Upcoming Games (next 7 days)</p>
                        <div class="empty">Click a sport to load upcoming games.</div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="site-footer">Made by Keirran Blackley.</footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/upcoming.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
